name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      version_code: ${{ steps.compute.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # git rev-list --count needs the full history.
          fetch-depth: 0

      - id: compute
        run: |
          DATE=$(TZ='Asia/Taipei' date +'%Y.%m.%d')
          SHA=$(git rev-parse --short HEAD)
          VERSION="${DATE}-${SHA}"
          TAG="v${VERSION}"
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"
          echo "Tag: ${TAG}"
          echo "Version code: ${VERSION_CODE}"

  deploy-web:
    needs: version
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Render config.js from template
        env:
          RESUME_DATA_HOST: ${{ vars.RESUME_DATA_HOST }}
          RESUME_VERSION: ${{ needs.version.outputs.version }}
        run: ./web/scripts/render-config.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ResumeCore
        env:
          RESUME_DATA_HOST: ${{ vars.RESUME_DATA_HOST }}
          RESUME_SHARE_URL: ${{ vars.RESUME_SHARE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ needs.version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ needs.version.outputs.tag }}
        run: ./gradlew :composeApp:assembleRelease

      - name: Stage APK with versioned filename
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p artifacts
          cp ResumeCore/composeApp/build/outputs/apk/release/composeApp-release.apk \
             "artifacts/resume-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: artifacts/*.apk
          if-no-files-found: error

  deploy-ios:
    needs: version
    # Switch to macos-latest when the iOS build is filled in.
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO iOS build & deploy (version=${{ needs.version.outputs.version }})"

  release:
    needs: [version, deploy-web, deploy-android, deploy-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading artifacts."
            gh release upload "$TAG" artifacts/*.apk --clobber --repo "$REPO"
          else
            gh release create "$TAG" \
              --target "$SHA" \
              --title "$TAG" \
              --notes "Automated release for $TAG." \
              --repo "$REPO" \
              artifacts/*.apk
          fi
