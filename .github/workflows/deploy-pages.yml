name: Deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to deploy
        type: choice
        options:
          - web
          - android
          - ios
        required: true
        default: web

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-web:
    if: inputs.platform == 'web'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          DATE=$(TZ='Asia/Taipei' date +'%Y.%m.%d')
          SHA=$(git rev-parse --short HEAD)
          VERSION="${DATE}-${SHA}"
          TAG="web-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"
          echo "Tag: ${TAG}"

      - name: Render config.js from template
        env:
          RESUME_DATA_HOST: ${{ vars.RESUME_DATA_HOST }}
          RESUME_VERSION: ${{ steps.version.outputs.version }}
        run: ./web/scripts/render-config.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Tag release
        run: |
          TAG='${{ steps.version.outputs.tag }}'
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"

  deploy-android:
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "TODO: Android build & deploy"

  deploy-ios:
    if: inputs.platform == 'ios'
    # Switch to macos-latest when the iOS build is filled in.
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "TODO: iOS build & deploy"
