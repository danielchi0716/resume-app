name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: compute
        run: |
          DATE=$(TZ='Asia/Taipei' date +'%Y.%m.%d')
          SHA=$(git rev-parse --short HEAD)
          VERSION="${DATE}-${SHA}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"
          echo "Tag: ${TAG}"

  deploy-web:
    needs: version
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Render config.js from template
        env:
          RESUME_DATA_HOST: ${{ vars.RESUME_DATA_HOST }}
          RESUME_VERSION: ${{ needs.version.outputs.version }}
        run: ./web/scripts/render-config.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO Android build & deploy (version=${{ needs.version.outputs.version }})"

  deploy-ios:
    needs: version
    # Switch to macos-latest when the iOS build is filled in.
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO iOS build & deploy (version=${{ needs.version.outputs.version }})"

  tag:
    needs: [version, deploy-web, deploy-android, deploy-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag release
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
